services:
  api:
    build: .
    environment:
      ENVIRONMENT: production
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-secret}
      DATABASE_URL: mysql+pymysql://ecommerce:ecommerce@mysql:3306/ecommerce
      REDIS_URL: redis://redis:6379/0
    depends_on: [mysql, redis]
    ports: ["8001:8001"]
  mysql:
    image: docker.m.daocloud.io/library/mysql:8.4
    environment:
      MYSQL_DATABASE: ecommerce
      MYSQL_USER: ecommerce
      MYSQL_PASSWORD: ecommerce
      MYSQL_ROOT_PASSWORD: root-change-me
    ports: ["3306:3306"]
    volumes: [mysql_data:/var/lib/mysql]
  redis:
    image: docker.m.daocloud.io/library/redis:7-alpine
    ports: ["6379:6379"]
volumes:
  mysql_data:
